<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d2b"><title>ALMOUNTAZAR BTP MANAGER</title>
<style>
:root{--g:#1f6b45;--d:#173d2b;--bg:#f3f6f4;--ink:#17231c;--muted:#66736b;--line:#dce5df;--red:#a8322a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--d);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:3}.brand b{display:block;font-size:17px}.brand small{color:#c9dfd0;letter-spacing:1px}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--g);color:white;border-color:var(--g)}.danger{color:var(--red)}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}aside{background:white;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px}.nav{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;font:inherit;cursor:pointer}.nav.active,.nav:hover{background:#e7f1ea;color:var(--d);font-weight:700}main{padding:22px;max-width:1500px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h1{margin:0;color:var(--d)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.metric small{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:11px}.metric strong{display:block;color:var(--d);font-size:21px;margin-top:7px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1ee;white-space:nowrap}th{background:#f4f8f5;color:#536158;font-size:11px;text-transform:uppercase}tr:last-child td{border:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.modal{display:none;position:fixed;inset:0;background:#07140dbb;z-index:5;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:white;border-radius:14px;padding:20px;width:min(680px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:4px;color:#536158}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd8d0;border-radius:8px;font:inherit}.field.full{grid-column:1/-1}.actions{display:flex;gap:6px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 10px 35px #173d2b12}.loginbox h1{color:var(--d);margin-top:0}.loginbox input{width:100%;padding:12px;margin:6px 0 13px;border:1px solid var(--line);border-radius:8px;font:inherit}.notice{background:#fff7e4;border:1px solid #f0dfb4;padding:11px;border-radius:9px;color:#72520b;margin:12px 0}.status{font-size:12px;color:#dceee2}.empty{text-align:center;padding:28px;color:var(--muted)}.loginbox button:disabled{opacity:.6;cursor:wait}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{flex-direction:row;overflow:auto;position:sticky;top:60px;z-index:2;border-right:0;border-bottom:1px solid var(--line)}.nav{white-space:nowrap;padding:8px}.grid{grid-template-columns:repeat(2,1fr)}main{padding:14px}}@media(max-width:520px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.grid{gap:8px}.metric strong{font-size:17px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox">
<h1>ALMOUNTAZAR<br>BTP MANAGER</h1><p class="muted">Espace administrateur sécurisé</p>
<form id="loginForm"><label>Adresse e-mail</label><input id="email" type="email" value="almountazarconstruction@gmail.com" required><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button class="btn primary" id="loginBtn" style="width:100%">Se connecter</button></form>
<p><button class="btn" id="forgot" type="button">Mot de passe oublié ?</button></p>
<div id="resetPanel" hidden><hr><h3>Nouveau mot de passe</h3><form id="resetForm"><label>Nouveau mot de passe</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><label>Confirmer le mot de passe</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="btn primary" id="resetBtn" style="width:100%">Enregistrer le nouveau mot de passe</button></form></div>
<p id="loginMsg" class="muted" role="status" aria-live="polite"></p><div class="notice">Accès réservé au compte administrateur autorisé dans Firebase.</div>
</div></div>
<div id="appShell" hidden><header><div class="brand"><b>ALMOUNTAZAR CONSTRUCTION</b><small>BTP MANAGER · FCFA</small></div><div><span id="userLabel" class="status"></span> <button class="btn" id="logout">Déconnexion</button></div></header><div class="layout"><aside id="nav"></aside><main id="main"></main></div></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Ajouter</h2><form id="recordForm"><div class="fields" id="fields"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary">Enregistrer</button></div></form></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBSnwitDLuAs9lmRNXkT4t-qjYkIg5PiZs",
  authDomain: "almountazar-metre-pro.firebaseapp.com",
  projectId: "almountazar-metre-pro",
  storageBucket: "almountazar-metre-pro.firebasestorage.app",
  messagingSenderId: "310048186815",
  appId: "1:310048186815:web:e8b44babebadbedff7c10a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL='almountazarconstruction@gmail.com';
const schema={
 clients:{label:'Clients',fields:[['nom','Nom / raison sociale','text',1],['telephone','Téléphone','text'],['email','E-mail','email'],['adresse','Adresse','text']]},
 chantiers:{label:'Chantiers',fields:[['nom','Nom du chantier','text',1],['client_id','Client','ref:clients',1],['adresse','Adresse / lieu','text'],['date_debut','Date de début','date'],['date_fin_prevue','Fin prévue','date'],['budget','Budget (FCFA)','number'],['statut','Statut','select:En préparation|En cours|En pause|Terminé|Réceptionné']]},
 devis:{label:'Devis & marchés',fields:[['numero','Numéro du devis','text',1],['client_id','Client','ref:clients'],['chantier_id','Chantier','ref:chantiers'],['date_devis','Date','date'],['montant_ht','Montant HT (FCFA)','number'],['montant_ttc','Montant TTC (FCFA)','number'],['statut','Statut','select:En attente|Accepté|Refusé|Facturé']]},
 encaissements:{label:'Encaissements',fields:[['chantier_id','Chantier','ref:chantiers'],['client_id','Client','ref:clients'],['date_paiement','Date','date'],['montant','Montant reçu (FCFA)','number',1],['mode_paiement','Mode de paiement','select:Espèces|Wave|Orange Money|Virement|Chèque|Autre'],['reference','Référence','text'],['observation','Observation','text']]},
 depenses:{label:'Dépenses',fields:[['chantier_id','Chantier','ref:chantiers'],['date_depense','Date','date'],['categorie','Catégorie','select:Matériaux|Main-d’œuvre|Transport|Location matériel|Sous-traitance|Carburant|Frais administratifs|Autres'],['designation','Désignation','text',1],['montant','Montant (FCFA)','number',1],['beneficiaire','Fournisseur / bénéficiaire','text'],['justificatif','N° pièce / facture','text']]},
 personnel:{label:'Personnel',fields:[['nom','Nom et prénom','text',1],['fonction','Fonction','text'],['telephone','Téléphone','text'],['type_contrat','Type de contrat','text'],['salaire_journalier','Tarif journalier (FCFA)','number'],['statut','Statut','select:Actif|Inactif']]},
 avances_equipe:{label:'Avances équipe',fields:[['personnel_id','Personnel','ref:personnel'],['chantier_id','Chantier','ref:chantiers'],['date_avance','Date','date'],['montant','Montant remis (FCFA)','number',1],['motif','Motif','text']]},
 stock_articles:{label:'Articles de stock',fields:[['reference','Référence','text'],['designation','Désignation','text',1],['unite','Unité','text'],['stock_minimum','Stock minimum','number']]},
 stock_mouvements:{label:'Mouvements de stock',fields:[['article_id','Article','ref:stock_articles',1],['chantier_id','Chantier','ref:chantiers'],['date_mouvement','Date','date'],['type_mouvement','Type','select:Entree|Sortie',1],['quantite','Quantité','number',1],['prix_unitaire','Prix unitaire (FCFA)','number'],['observation','Observation','text']]},
 main_oeuvre:{label:'Main-d’œuvre',fields:[['personnel_id','Personnel','ref:personnel'],['chantier_id','Chantier','ref:chantiers'],['date_travail','Date','date'],['nombre_jours','Nombre de jours','number',1],['tarif_journalier','Tarif journalier (FCFA)','number',1],['montant','Montant payé / dû (FCFA)','number'],['observation','Observation','text']]},
 devis_lignes:{label:'Lignes de devis',fields:[['devis_id','Devis','ref:devis',1],['designation','Désignation','text',1],['unite','Unité','text'],['quantite','Quantité','number'],['prix_unitaire','Prix unitaire (FCFA)','number'],['montant','Montant (FCFA)','number']]}
};
const order=['chantiers','clients','devis','devis_lignes','encaissements','depenses','personnel','avances_equipe','stock_articles','stock_mouvements','main_oeuvre'];let cache={},current='dashboard',editing=null;
const $=id=>document.getElementById(id);const money=n=>(Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' FCFA';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadAll(){for(const k of order){const snap=await db.collection(k).get();cache[k]=snap.docs.map(d=>({id:d.id,...d.data()}));cache[k].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));}}
function showApp(user){$('login').hidden=true;$('appShell').hidden=false;$('userLabel').textContent=user.email||'';buildNav();refresh()}
function buildNav(){$('nav').innerHTML='<button class="nav" data-k="dashboard">▦ Tableau de bord</button>'+order.map(k=>`<button class="nav" data-k="${k}">${schema[k].label}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.k;refresh()})}
function refresh(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.k===current));if(current==='dashboard')dashboard();else listPage(current)}
function dashboard(){let enc=(cache.encaissements||[]).reduce((s,x)=>s+(+x.montant||0),0),dep=(cache.depenses||[]).reduce((s,x)=>s+(+x.montant||0),0),bud=(cache.chantiers||[]).reduce((s,x)=>s+(+x.budget||0),0);$('main').innerHTML=`<div class="head"><div><h1>Tableau de bord</h1><span class="muted">Données synchronisées avec Firebase · FCFA</span></div><button class="btn" onclick="refreshData()">Actualiser</button></div><div class="grid">${metric('Chantiers',cache.chantiers.length)}${metric('Clients',cache.clients.length)}${metric('Budget total',money(bud))}${metric('Encaissements',money(enc))}${metric('Dépenses',money(dep))}${metric('Trésorerie théorique',money(enc-dep))}${metric('Devis',cache.devis.length)}${metric('Personnel',cache.personnel.length)}</div><div class="notice">Les données affichées proviennent de votre base Firestore. L’accès est contrôlé par les règles de sécurité Firebase.</div><h3>Chantiers récents</h3>${tableHTML('chantiers')}`}
function metric(t,v){return `<div class="card"><small class="muted">${t}</small><strong style="display:block;color:#173d2b;font-size:20px;margin-top:6px">${v}</strong></div>`}
function refLabel(field,id){let k=field.slice(4),row=(cache[k]||[]).find(x=>x.id===id);return row?(row.nom||row.designation||row.numero||row.reference||id):'—'}
function displayVal(k,row,f){let v=row[f[0]];if(f[2].startsWith('ref:'))return refLabel(f[2],v);if(f[2]==='number')return f[1].includes('FCFA')?money(v):(v??'—');return v??'—'}
function tableHTML(k){let s=schema[k];let rows=(cache[k]||[]).map(r=>`<tr>${s.fields.slice(0,6).map(f=>`<td>${esc(displayVal(k,r,f))}</td>`).join('')}<td><button class="btn" onclick="editRecord('${k}','${r.id}')">Modifier</button> <button class="btn danger" onclick="deleteRecord('${k}','${r.id}')">Supprimer</button></td></tr>`).join('');return `<div class="tablewrap"><table><thead><tr>${s.fields.slice(0,6).map(f=>`<th>${f[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows||`<tr><td colspan="${Math.min(s.fields.length,6)+1}" class="empty">Aucun enregistrement</td></tr>`}</tbody></table></div>`}
function listPage(k){$('main').innerHTML=`<div class="head"><div><h1>${schema[k].label}</h1><span class="muted">${(cache[k]||[]).length} enregistrement(s) · synchronisé</span></div><button class="btn primary" onclick="openRecord('${k}')">＋ Ajouter</button></div><div class="toolbar"><input placeholder="Rechercher dans cette liste…" oninput="filterTable(this.value)"><button class="btn" onclick="refreshData()">Actualiser</button></div><div id="tableArea">${tableHTML(k)}</div>`}
function filterTable(q){$('tableArea').querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function openRecord(k,id=null){editing={k,id};let row=id?(cache[k]||[]).find(x=>x.id===id):{};$('modalTitle').textContent=(id?'Modifier : ':'Ajouter : ')+schema[k].label;$('fields').innerHTML=schema[k].fields.map(f=>fieldHTML(f,row)).join('');$('modal').classList.add('open')}
function editRecord(k,id){openRecord(k,id)}
function fieldHTML(f,row){let [key,label,type,required]=f,v=row?.[key]??'';let req=required?'required':'';if(type.startsWith('ref:')){let k=type.slice(4);return `<div class="field"><label>${label}</label><select name="${key}" ${req}><option value="">Sélectionner…</option>${(cache[k]||[]).map(r=>{let txt=r.nom||r.designation||r.numero||r.reference||r.id;return `<option value="${r.id}" ${v===r.id?'selected':''}>${esc(txt)}</option>`}).join('')}</select></div>`}if(type.startsWith('select:'))return `<div class="field"><label>${label}</label><select name="${key}" ${req}><option value="">Sélectionner…</option>${type.slice(7).split('|').map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(v)}" ${req} ${type==='number'?'step="any" min="0"':''}></div>`}
$('recordForm').onsubmit=async e=>{e.preventDefault();let {k,id}=editing,fd=new FormData(e.target),payload={};for(let f of schema[k].fields){let v=fd.get(f[0]);payload[f[0]]=f[2]==='number'?(v===''?0:Number(v)):(v||null)}try{if(id){await db.collection(k).doc(id).update(payload)}else{payload.created_at=new Date().toISOString();await db.collection(k).add(payload)}$('modal').classList.remove('open');await refreshData()}catch(err){alert('Enregistrement impossible : '+err.message)}};
async function deleteRecord(k,id){if(!confirm('Supprimer définitivement cet enregistrement ?'))return;try{await db.collection(k).doc(id).delete();await refreshData()}catch(e){alert('Suppression impossible : '+e.message)}}
async function refreshData(){try{await loadAll();refresh()}catch(e){alert('Erreur de synchronisation Firebase : '+e.message)}}
$('cancel').onclick=()=>$('modal').classList.remove('open');
$('logout').onclick=async()=>{await auth.signOut();location.reload()};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){$('loginMsg').textContent='Saisissez votre adresse e-mail.';return}$('forgot').disabled=true;$('loginMsg').textContent='Envoi de la demande…';try{await auth.sendPasswordResetEmail(email,{url:window.location.origin+window.location.pathname});$('loginMsg').textContent='E-mail de réinitialisation envoyé. Consultez votre boîte de réception.'}catch(e){$('loginMsg').textContent='Erreur : '+e.message}$('forgot').disabled=false};
let resetCode=null;
$('resetForm').onsubmit=async e=>{e.preventDefault();const pw=$('newPassword').value,confirm=$('confirmPassword').value;if(pw.length<8){$('loginMsg').textContent='Le mot de passe doit contenir au moins 8 caractères.';return}if(pw!==confirm){$('loginMsg').textContent='Les deux mots de passe ne correspondent pas.';return}if(!resetCode){$('loginMsg').textContent='Lien de réinitialisation invalide ou expiré.';return}$('resetBtn').disabled=true;try{await auth.confirmPasswordReset(resetCode,pw);$('loginMsg').textContent='Mot de passe modifié. Vous pouvez vous connecter.';$('resetPanel').hidden=true;$('loginForm').hidden=false;$('forgot').hidden=false;$('password').value=''}catch(err){$('loginMsg').textContent='Erreur : '+err.message}finally{$('resetBtn').disabled=false}};
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginMsg').textContent='Connexion…';try{const cred=await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);if(cred.user.email?.toLowerCase()!==ADMIN_EMAIL){await auth.signOut();$('loginMsg').textContent='Accès réservé au compte administrateur.';return}await loadAll();showApp(cred.user)}catch(err){$('loginMsg').textContent='Connexion refusée : '+err.message}finally{$('loginBtn').disabled=false}};
(async()=>{try{const params=new URLSearchParams(location.search);if(params.get('mode')==='resetPassword'&&params.get('oobCode')){resetCode=params.get('oobCode');await auth.verifyPasswordResetCode(resetCode);$('resetPanel').hidden=false;$('loginForm').hidden=true;$('forgot').hidden=true;$('loginMsg').textContent='Lien de réinitialisation valide. Choisissez votre nouveau mot de passe.';return}const user=auth.currentUser;if(user){if(user.email?.toLowerCase()===ADMIN_EMAIL){await loadAll();showApp(user)}else await auth.signOut()}}catch(e){$('loginMsg').textContent='Erreur Firebase : '+e.message}})();
</script></body></html>
